<!DOCTYPE html>
<html lang="en" class="theme-neon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Zenkira | Elite Anime Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Bangers&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #070707;
        --bg-card: #0c0c0c;
        --bg-glass: rgba(7, 7, 7, 0.85);
        --text-white: #FFFFFF;
        --text-muted: #888888;
        --border-color: rgba(255, 255, 255, 0.1);
        --neon-primary: #FF2E88;
        --neon-secondary: #00F5FF;
        --neon-tertiary: #CCFF00;
        --card-shadow: rgba(255, 46, 136, 0.3);
        --haki-purple: #4B0082;
        --chakra-blue: #00A3FF;
      }

      .theme-solar {
        --neon-primary: #FF6600;
        --neon-secondary: #FFD700;
        --neon-tertiary: #FF0033;
        --card-shadow: rgba(255, 102, 0, 0.3);
      }

      .theme-void {
        --neon-primary: #B026FF;
        --neon-secondary: #00F5FF;
        --neon-tertiary: #FF2E88;
        --card-shadow: rgba(176, 38, 255, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-white);
        background-image: 
          radial-gradient(circle at 2px 2px, rgba(255,255,255,0.02) 1px, transparent 0);
        background-size: 24px 24px;
      }

      .font-header { font-family: 'Space Grotesk', sans-serif; }
      .font-anime { font-family: 'Bangers', cursive; }

      .manga-halftone {
        background-image: radial-gradient(circle, currentColor 1px, transparent 1px);
        background-size: 4px 4px;
      }

      .speed-lines {
        background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255, 255, 255, 0.03) 40px, rgba(255, 255, 255, 0.03) 41px);
      }

      .skew-panel {
        transform: skewY(-1deg);
        transition: transform 0.3s ease;
      }
      .skew-panel:hover { transform: skewY(0deg); }
      
      .skew-content {
        transform: skewY(1deg);
        transition: transform 0.3s ease;
      }
      .skew-panel:hover .skew-content { transform: skewY(0deg); }

      .anime-panel {
        background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.8) 100%);
        border: 2px solid white;
        box-shadow: 10px 10px 0px var(--neon-primary);
      }

      /* Hover Glow */
      .glow-neon-primary-hover:hover {
        box-shadow: 0 0 35px var(--card-shadow);
        border-color: var(--neon-primary);
      }

      /* Animations */
      @keyframes scanner-beam {
        0% { top: -10%; }
        100% { top: 110%; }
      }
      .animate-scanner-beam { animation: scanner-beam 2s linear infinite; }

      @keyframes aura-shine {
        0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
        100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
      }
      .animate-aura-shine { animation: aura-shine 1.5s infinite; }

      @keyframes jitter-high {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-2px, 1px); }
        40% { transform: translate(1px, -2px); }
        60% { transform: translate(-1px, 2px); }
        80% { transform: translate(2px, -1px); }
      }
      .animate-jitter-high { animation: jitter-high 0.1s infinite; }

      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow { animation: spin-slow 8s linear infinite; }

      .speech-bubble {
        background: white;
        color: black;
        padding: 4px 12px;
        font-family: 'Bangers', cursive;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        position: relative;
        font-size: 14px;
        border: 2px solid black;
        white-space: nowrap;
      }
      .speech-bubble::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 12px;
        border-left: 8px solid white;
        border-bottom: 8px solid transparent;
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-dark); }
      ::-webkit-scrollbar-thumb { background: #fff; border-radius: 3px; }

      @media (max-width: 640px) {
        .container {
          padding-left: 1rem;
          padding-right: 1rem;
        }
      }
    </style>

</html>
